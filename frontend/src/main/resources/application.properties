spring.application.name=seguridadcalidad
backend.base-url=${BACKEND_URL:http://localhost:8081}
logging.level.com.duoc.seguridadcalidad=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http=INFO
logging.file.path=./logs

# JWT cookie — secure=false para desarrollo local (HTTP). En producción usar HTTPS y JWT_COOKIE_SECURE=true
app.security.jwt-cookie.secure=${JWT_COOKIE_SECURE:false}
app.security.jwt-cookie.max-age-seconds=${JWT_COOKIE_MAX_AGE_SECONDS:3600}
app.security.jwt-cookie.same-site=${JWT_COOKIE_SAME_SITE:Lax}

server.port=8080

# In-memory user passwords — override with USER_PASSWORD / ADMIN_PASSWORD env vars in production
app.security.user-password=${USER_PASSWORD:changeme-user}
app.security.admin-password=${ADMIN_PASSWORD:changeme-admin}