name: jenkins-sonarqube

networks:
  syc_net:
    driver: bridge
    external: true

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: no
    ports:
      - "8082:8080"
      - "50000:50000"
    volumes:
      - ./reportes/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - syc_net
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
      - JENKINS_SLAVE_AGENT_PORT=50000

  sonarqube:
    image: sonarqube:lts
    container_name: sonarqube
    restart: no
    ports:
      - "9000:9000"
    volumes:
      - ./reportes/sonarqube_data:/opt/sonarqube/data
      - ./reportes/sonarqube_logs:/opt/sonarqube/logs
      - ./reportes/sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - syc_net
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
