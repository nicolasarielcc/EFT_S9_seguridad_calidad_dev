# Define la red compartida para toda la aplicación
networks:
  syc_net:
    driver: bridge
    external: true

services:
  mysql:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: vet-db
    networks:
      - syc_net
    environment:
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vet-backend
    networks:
      - syc_net
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: password
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-cHJvZHVjdGlvbi1zZWNyZXQtcGFyYS1qd3QtZmlybWFkby1zZWd1cm8tMjAyNg==}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vet-frontend
    networks:
      - syc_net
    environment:
      BACKEND_URL: http://vet-backend:8081
      SERVER_PORT: 8080
      USER_PASSWORD: ${USER_PASSWORD:-S3cur3Us3r!2026}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-S3cur3Adm1n!2026}
      JWT_COOKIE_SECURE: "false"
      JWT_COOKIE_SAME_SITE: Lax
    ports:
      - "8080:8080"
    depends_on:
      - backend

