# Define la red compartida para toda la aplicación
networks:
  syc_net:
    driver: bridge
    external: false

services:
  mysql:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: vet-db
    networks:
      - syc_net
    environment:
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vet-backend
    networks:
      - syc_net
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: password
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vet-frontend
    networks:
      - syc_net
    environment:
      BACKEND_URL: http://backend:8081
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      - backend

